<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | Vivero Raíz</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/validaciones.js" defer></script>
    <script src="./js/datos.js" defer></script>
    <script src="./js/catalogo.js" defer></script>
</head>

<body>
    <header>
        <a href="index.html">
            <img src="./images/vivero-raiz-logo.png" alt="Logo de Vivero" width="250">
        </a>
        <button type="button" id="boton-menu" class="menu-toggle" aria-controls="menu-principal" aria-expanded="false"
            aria-label="Abrir o cerrar menu">☰</button>
        <nav id="menu-principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Catálogo de Plantas</h2>
            <p>Explora nuestra variedad adaptada para cada espacio de tu hogar.</p>

            <div class="filtros-catalogo">
                <div>
                    <label for="buscar-planta">Buscar por nombre</label>
                    <input type="search" id="buscar-planta" class="campo-entrada" placeholder="Ej.: Geranio">
                </div>
            </div>

            <div>
                <label for="filtro-categoria">Categoría</label>
                <select id="filtro-categoria" class="campo-entrada">
                    <option value="">Todas</option>
                    <option value="interior">Interior</option>
                    <option value="exterior">Exterior</option>
                    <option value="suculenta">Suculenta</option>
                    <option value="aromática">Aromática</option>
                </select>
            </div>

            <div>
                <label for="ordenar-por">Ordenar por</label>
                <select id="ordenar-por" class="campo-entrada">
                    <option value="original">Orden original</option>
                    <option value="nombre-asc">Nombre (A-Z)</option>
                    <option value="nombre-desc">Nombre (Z-A)</option>
                    <option value="precio-asc">Precio: menor a mayor</option>
                    <option value="precio-desc">Precio: mayor a menor</option>
                </select>
            </div>

            <div>
                <button type="button" id="limpiar-filtros" class="boton">Limpiar filtros</button>
            </div>

            <p id="contador-resultados" aria-live="polite"> 5 plantas encontradas</p>

            <p id="sin-resultados" role="status" hidden>No encontramos plantas con ese criterio.</p>

            <div class="grilla article" id="catalogo-plantas"></div>
        </section>
    </main>

    <footer>
        <div class="footer">
            <p class="p-footer">&copy; 2026 Vivero Raíz. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>

</html>
