<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Vivero Raíz</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header>
        <a href="index.html">
            <img src="./images/vivero-raiz-logo.png" alt="Logo de Vivero" width="250">
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contáctanos</h2>
            <p>Déjanos tus datos y responderémos sobre nuestras plantas y servicios</p>
        </section>

        <article>
            <div>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre">
            </div>
            <br>
            <div>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email">
            </div>
            <br>
            <div>
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono">
            </div>
            <br>
            <div>
                <label for="mensaje">Motivo de la consulta:</label>
                <select id="motivo" name="motivo">
                    <option value="disponibilidad">Disponibilidad de plantas</option>
                    <option value="cuidados">Asesoramiento de cuidados</option>
                    <option value="otro">Otro motivo</option>
                </select>
            </div>
            <br>
            <div>
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5"></textarea>
            </div>
        </article>
    </main>

    <aside>
        <h3>Información de contacto</h3>
        <p>Teléfono: +54 9 264 414-7052</p>
        <p>Email: franco.martinez@istea.com.ar</p>
    </aside>

    <footer>
        <div class="footer">
            <p>&copy; 2026 Vivero Raíz. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>

</html>
