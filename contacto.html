<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Vivero Raíz</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/validaciones.js" defer></script>
</head>

<body>
    <header>
        <a href="index.html">
            <img src="./images/vivero-raiz-logo.png" alt="Logo de Vivero" width="250">
        </a>
        <button type="button" id="boton-menu" class="menu-toggle" aria-controls="menu-principal" aria-expanded="false"
            aria-label="Abrir o cerrar menu">☰</button>
        <nav id="menu-principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contáctanos</h2>
            <p>Déjanos tus datos y responderémos sobre nuestras plantas y servicios</p>
        </section>

        <article>
            <form id="form-contacto" novalidate>
                <div class="mensaje-formulario alerta" role="status" aria-live="polite" hidden>
                </div>
                <div>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" class="campo-entrada">
                </div>
                <br>
                <div>
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" class="campo-entrada">
                </div>
                <br>
                <div>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" class="campo-entrada">
                </div>
                <br>
                <div>
                    <label for="motivo">Motivo de la consulta:</label>
                    <select id="motivo" name="motivo" class="campo-entrada">
                        <option value="" selected>Seleccioná un motivo</option>
                        <option value="disponibilidad">Disponibilidad de plantas</option>
                        <option value="cuidados">Asesoramiento de cuidados</option>
                        <option value="otro">Otro motivo</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" class="campo-entrada"></textarea>
                </div>
                <p>
                    <label>
                        <input type="checkbox" name="novedades">
                        Quiero recibir novedades del vivero
                    </label>
                </p>

                <button type="submit" class="boton">
                    Enviar consulta
                </button>
            </form>
        </article>
    </main>

    <aside>
        <h3>Información de contacto</h3>
        <p>Teléfono: <strong>+54 9 264 414-7052</strong></p>
        <p>Email: <a href="mailto:franco.martinez@istea.com.ar">franco.martinez@istea.com.ar</a></p>
    </aside>

    <footer>
        <div class="footer">
            <p class="p-footer">&copy; 2026 Vivero Raíz. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>

</html>
