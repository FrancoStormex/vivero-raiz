<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Vivero Raíz</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/validaciones.js" defer></script>
</head>

<body>

    <header>
        <a href="index.html">
            <img src="./images/vivero-raiz-logo.png" alt="Logo de Vivero" width="250">
        </a>
        <button type="button" id="boton-menu" class="menu-toggle" aria-controls="menu-principal" aria-expanded="false"
            aria-label="Abrir o cerrar menu">☰</button>
        <nav id="menu-principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Crear una cuenta</h2>
            <p>Únete a nuestra comunidad para guardar tus plantas favoritas.</p>

            <form id="form-registro" novalidate>
                <div class="mensaje-formulario alerta" role="status" aria-live="polite" hidden></div>

                <fieldset>
                    <legend>Datos personales</legend>
                    <p>
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" class="campo-entrada">
                    </p>
                    <p>
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" class="campo-entrada">
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Contacto y envío</legend>
                    <p>
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" class="campo-entrada">
                    </p>
                    <p>
                        <label for="direccion">Dirección de entrega:</label>
                        <input type="text" id="direccion" name="direccion" class="campo-entrada">
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Seguridad de la cuenta</legend>
                    <p>
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" class="campo-entrada">
                    </p>
                    <p>
                        <label for="confirmar-password">Confirmar contraseña:</label>
                        <input type="password" id="confirmar-password" name="confirmar-password" class="campo-entrada">
                    </p>
                </fieldset>
                <p>
                    <label for="terminos">
                        <input type="checkbox" id="terminos" name="terminos">
                        Acepto los términos y condiciones
                    </label>
                </p>
                <p>
                    <button type="submit" class="boton">Completar Registro</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer">
            <p class="p-footer">&copy; 2026 Vivero Raíz. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>

</html>
